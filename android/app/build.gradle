plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wuliao00.gengling'
    compileSdk 34

    defaultConfig {
        applicationId "com.wuliao00.gengling"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            // 从环境变量读取（CI 注入 GitHub Secrets 解码出的密钥库）；
            // 本地/无密钥时不配置，buildTypes.release 回退 debug 签名。
            def kf = System.getenv('KEYSTORE_FILE')
            if (kf) {
                storeFile file(kf)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('KEYSTORE_FILE')) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // 把仓库根目录的 H5 游戏（index.html / css / js / assets）打包进 APK 的 assets，实现离线可玩
    sourceSets {
        main {
            assets.srcDir "$buildDir/generated/web"
        }
    }
}

dependencies {
    // 统一 Kotlin stdlib 版本，避免 androidx 传递依赖引入 kotlin-stdlib-jdk8 造成重复类
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.24')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}

// 构建前把 H5 游戏文件复制进 assets 暂存目录（单一数据源：仓库根目录）
tasks.register('copyWeb', Copy) {
    def webRoot = rootProject.projectDir.parentFile   // gengling/（android/ 的上一级）
    from(webRoot) {
        include 'index.html'
        include 'css/**'
        include 'js/**'
        include 'assets/**'
    }
    into "$buildDir/generated/web"
}

preBuild.dependsOn copyWeb

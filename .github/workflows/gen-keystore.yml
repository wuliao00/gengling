name: gen-keystore

# 一次性工作流：生成 release 签名密钥库（PKCS12），产物为 base64 + 密码 json。
# 安全约定：密码在 CI 内随机生成，只写入 artifact，不回显到日志；
#           请在仓库为 PRIVATE 时运行并下载 artifact，设置 Secrets 后删除 artifact。
on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate release keystore
        run: |
          SP="$(openssl rand -base64 24)"
          KP="$(openssl rand -base64 24)"
          keytool -genkeypair -v -keystore release.keystore -alias gengling \
            -keyalg RSA -keysize 2048 -validity 10000 -storetype PKCS12 \
            -storepass "$SP" -keypass "$KP" \
            -dname "CN=gengling, OU=gengling, O=gengling, C=CN"
          base64 -w0 release.keystore > release.keystore.b64
          printf '{"store_password":"%s","key_password":"%s","alias":"gengling"}' "$SP" "$KP" > keystore-creds.json
          echo "keystore generated (creds only in artifact)"

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: |
            release.keystore.b64
            keystore-creds.json
          if-no-files-found: error
